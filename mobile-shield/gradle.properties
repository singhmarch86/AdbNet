# JVM args for the Gradle build process (and the single-use daemon it forks).
# preferIPv4Stack avoids IPv6 connect timeouts on networks with broken IPv6
# routes; the heap and encoding are sane defaults for Android builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# AndroidX is required by the Android app module.
android.useAndroidX=true
